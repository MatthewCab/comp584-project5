
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>


    <div class="wrapper">
        <h1>Weather</h1>
        <article class="row-1-item-1">
            <h2>Search a City</h2>
            <input type="text" id="city" placeholder="Enter a city">
            <button id="search">Get Weather</button>
        </article>

        <article class="row-1-item-2">
            <div id="weather">
                <h2>Current Weather</h2>
                <div id="weatherInfo"></div>
            </div>
        </article>

        <h1>7-Day Forecast</h1>
        <div class="row-2">
            <div id="forecast">
            </div>
        </div>

    </div>
</body>
</html>
